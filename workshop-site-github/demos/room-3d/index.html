<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Комната · 3D обзор</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dce6e7;color:#253e39;font:14px system-ui,sans-serif;overflow:hidden}canvas{width:100%;height:100svh;display:block;touch-action:none}header{position:fixed;top:18px;left:18px;right:18px;pointer-events:none}h1{font-size:22px;margin:0 0 7px;font-weight:550}header span{background:#ffffffe0;padding:7px 11px;border-radius:12px;font-size:12px;display:inline-block}footer{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:14px;right:14px;display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #ffffff70;background:#fffffff0;color:#253e39;border-radius:16px;padding:13px 16px;font:inherit;cursor:pointer;box-shadow:0 4px 20px #0001}#gyro{background:#284e45;color:white}#status{position:fixed;bottom:85px;left:18px;right:18px;pointer-events:none;font-size:12px;max-width:500px;padding:10px 13px;border-radius:12px;background:#ffffffe8;line-height:1.5}.dot{position:fixed;top:50%;left:50%;width:5px;height:5px;border-radius:50%;background:#fff8;box-shadow:0 0 0 1px #0002;pointer-events:none}</style><script src="../../assets/demo-nav.js" defer></script>

<body><canvas id="view" aria-label="Трёхмерная комната. Потяните пальцем для осмотра."></canvas><header><h1>Современная комната</h1><span id="mode">3D · обзор пальцем на 360°</span></header><div class="dot"></div><div id="status" role="status">Вы стоите в центре комнаты. Проведите пальцем по экрану или включите гироскоп.</div><footer><button id="gyro">Включить гироскоп</button><button id="reset">Центрировать</button><button id="full">На весь экран</button></footer>
<script>
'use strict';
// Автономный WebGL: геометрия, освещение и управление без библиотек и сети.
const canvas=document.querySelector('#view'),status=document.querySelector('#status'),mode=document.querySelector('#mode'),gyroButton=document.querySelector('#gyro');
const gl=canvas.getContext('webgl',{antialias:true,alpha:false});
if(!gl){status.textContent='WebGL недоступен. Попробуйте открыть файл в другом браузере.';throw Error('WebGL unavailable')}
const vs='attribute vec3 aPosition;attribute vec3 aColor;uniform mat4 uMatrix;varying vec3 vColor;void main(){vColor=aColor;gl_Position=uMatrix*vec4(aPosition,1.0);}';
const fs='precision mediump float;varying vec3 vColor;void main(){gl_FragColor=vec4(vColor,1.0);}';
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
let vertices=[];
function rgb(hex){return hex.match(/\w\w/g).map(v=>parseInt(v,16)/255)}
function face(points,color,shade=1){const c=rgb(color).map(v=>v*shade);for(const i of [0,1,2,0,2,3])vertices.push(...points[i],...c)}
function box(x,y,z,w,h,d,c){const X=x+w,Y=y+h,Z=z+d;face([[x,Y,z],[x,Y,Z],[X,Y,Z],[X,Y,z]],c,1);face([[x,y,Z],[X,y,Z],[X,Y,Z],[x,Y,Z]],c,.86);face([[X,y,z],[x,y,z],[x,Y,z],[X,Y,z]],c,.94);face([[X,y,Z],[X,y,z],[X,Y,z],[X,Y,Z]],c,.76);face([[x,y,z],[x,y,Z],[x,Y,Z],[x,Y,z]],c,.9);face([[x,y,z],[X,y,z],[X,y,Z],[x,y,Z]],c,.65)}
function cylinder(x,y,z,r,h,c,n=20){const col=rgb(c);for(let i=0;i<n;i++){const a=i/n*Math.PI*2,b=(i+1)/n*Math.PI*2,A=[x+Math.cos(a)*r,y,z+Math.sin(a)*r],B=[x+Math.cos(b)*r,y,z+Math.sin(b)*r],C=[B[0],y+h,B[2]],D=[A[0],y+h,A[2]];face([A,B,C,D],c,.78+.16*Math.cos(a));for(const p of [[x,y+h,z],D,C])vertices.push(...p,...col)}}
// Пол с отдельными досками, потолок и четыре стены.

for(let i=0;i<16;i++)for(let j=0;j<4;j++)box(-4+i*.5,.002,-4+j*2,.488,.012,1.985,['c9ae8c','c2a481','d0b796','c6a986'][(i*7+j*3)%4]);
box(-4,0,-4.13,8,3.2,.13,'eeeee5');box(-4,0,4,8,3.2,.13,'e1e5df');box(4,0,-4,.13,3.2,8,'e8e6dc');box(-4.13,0,-4,.13,3.2,8,'dbe2dc');box(-4,3.2,-4,8,.12,8,'f6f5ed');
for(const z of [-3.98,3.95])box(-4,0,z,8,.1,.04,'f8f4eb');for(const x of [-3.98,3.95])box(x,0,-4,.04,.1,8,'f8f4eb');
// Окно и условный вид за стеклом.
box(-2.9,1.18,-3.97,3.25,1.65,.07,'faf8ee');box(-2.8,1.28,-3.88,3.05,1.45,.035,'badbe2');box(-2.8,1.28,-3.83,3.05,.45,.02,'9eb9a0');
for(let i=0;i<5;i++)box(-2.7+i*.59,1.28,-3.8,.37,.2+(i%3)*.12,.02,'88a597');
box(-1.32,1.2,-3.75,.065,1.6,.1,'faf8ee');box(-2.9,1.94,-3.75,3.25,.06,.1,'faf8ee');box(-3,1.14,-3.95,3.45,.08,.33,'f5eee1');
for(const x of [-3.18,.38])for(let i=0;i<5;i++)box(x+i*.07,.7,-3.65,.05,2.16,.14,i%2?'dbd6c7':'e7e1d4');
// Диван вдоль левой стены.
for(const x of [-3.6,-2.7])for(const z of [-1.65,1.55])box(x,.04,z,.09,.19,.09,'685b4b');
box(-3.8,.2,-1.85,1.32,.34,3.7,'6c8c80');box(-3.85,.5,-1.85,.27,.65,3.7,'8ba99a');
for(let i=0;i<3;i++)box(-3.53,.54,-1.61+i*1.08,1,.17,1.01,'a2baaa');
for(const z of [-1.9,1.65])box(-3.85,.47,z,1.4,.42,.25,'8ba99a');
box(-3.48,.72,-1.4,.3,.42,.62,'d7bd91');box(-3.48,.72,.9,.3,.42,.57,'cad1bd');
// Ковёр и журнальный стол.
box(-2.2,.024,-1.75,3.75,.016,3.5,'ded6c4');for(let i=0;i<18;i++)box(-2.1,.043,-1.65+i*.18,3.55,.003,.013,'c9c1af');
for(const x of [-1.66,-.55])for(const z of [-.64,.64])box(x,.05,z,.07,.47,.07,'72553d');box(-1.85,.52,-.85,1.55,.12,1.7,'b88c61');
box(-1.58,.645,-.52,.56,.025,.75,'e8e2d2');box(-1.54,.673,-.48,.48,.003,.12,'628b80');cylinder(-.7,.645,.43,.16,.025,'eee9df');cylinder(-.7,.67,.43,.095,.15,'ebe4d5');cylinder(-.7,.821,.43,.078,.003,'5f4432');
// ТВ, консоль и книги на противоположной стене.
box(3.35,.14,-1.7,.53,.66,3.4,'ae8965');for(const z of [-.56,.56])box(3.34,.23,z,.55,.012,.018,'806044');box(3.85,1.22,-1.12,.08,1.32,2.24,'303d3c');box(3.80,1.28,-1.05,.035,1.18,2.1,'263e48');box(3.76,1.32,-.99,.02,.05,1.98,'44616b');
for(let i=0;i<6;i++)box(3.41,.81,-1.4+i*.115,.3,.24+(i%3)*.06,.075,['617f79','d6c5a4','b87e60'][i%3]);
// Дверь, ручка и картина сзади.
box(1.9,0,3.91,1.27,2.55,.08,'c1a17b');box(2,.04,3.85,1.06,2.42,.04,'ddc4a2');cylinder(2.18,1.08,3.77,.04,.08,'766956');box(2.15,1.13,3.74,.2,.035,.045,'766956');
box(-1.85,1.3,3.91,1.8,1.24,.06,'8c7258');box(-1.77,1.38,3.86,1.64,1.08,.04,'e6d7be');box(-1.65,1.4,3.81,1.4,.38,.03,'789181');box(-1.4,1.77,3.80,.48,.49,.025,'bf9571');
// Растение у окна.
cylinder(-3.04,.02,-2.95,.3,.6,'ba9272');cylinder(-3.04,.55,-2.95,.26,.03,'5e5140');
for(let i=0;i<9;i++){const a=i*2.4,x=-3.04+Math.cos(a)*.35,z=-2.95+Math.sin(a)*.35,y=.9+(i%4)*.18;box(x-.015,.55,z-.015,.03,y-.55,.03,'557852');box(x-.19,y,z-.11,.38,.065,.22,i%2?'6e9566':'527e58')}
// Торшер и потолочный светильник.
cylinder(-2.4,0,2.65,.28,.055,'4b5952');cylinder(-2.4,.055,2.65,.025,1.92,'55625a');cylinder(-2.4,1.65,2.65,.38,.38,'e7d6b4');cylinder(0,2.95,0,.04,.25,'68716a');cylinder(0,2.78,0,.46,.18,'dfd2b8');
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);const count=vertices.length/6;
for(const [name,offset] of [['aPosition',0],['aColor',12]]){const a=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,24,offset)}
gl.enable(gl.DEPTH_TEST);gl.clearColor(.85,.9,.9,1);const matrixUniform=gl.getUniformLocation(program,'uMatrix');
// Кватернионы: ориентация телефона с учётом поворота экрана.
function qm(a,b){const [x,y,z,w]=a,[X,Y,Z,W]=b;return [w*X+x*W+y*Z-z*Y,w*Y-x*Z+y*W+z*X,w*Z+x*Y-y*X+z*W,w*W-x*X-y*Y-z*Z]}
function qa(x,y,z,a){const s=Math.sin(a/2);return [x*s,y*s,z*s,Math.cos(a/2)]}
function manualQ(){return qm(qa(0,1,0,yaw),qa(1,0,0,pitch))}
function yawOf(q){const [x,y,z,w]=q;return Math.atan2(2*(x*z+w*y),1-2*(x*x+y*y))}
let yaw=.45,pitch=-.03,sensor=false,raw=null,alignment=null,viewQ=manualQ(),timer=null,activePointer=null;
function sensorQ(e){const r=Math.PI/180,angle=(screen.orientation?.angle??window.orientation??0)*r;return qm(qm(qm(qm(qa(0,1,0,e.alpha*r),qa(1,0,0,e.beta*r)),qa(0,0,1,-e.gamma*r)),qa(1,0,0,-Math.PI/2)),qa(0,0,1,-angle))}
function onOrientation(e){if(!sensor||![e.alpha,e.beta,e.gamma].every(Number.isFinite))return;raw=sensorQ(e);if(alignment===null)alignment=yaw-yawOf(raw);clearTimeout(timer);mode.textContent='3D · управление поворотами телефона';status.textContent='Гироскоп работает. Поворачивайтесь с телефоном, чтобы осмотреть комнату.'}
addEventListener('deviceorientation',onOrientation);
function stopSensor(){sensor=false;raw=null;alignment=null;clearTimeout(timer);gyroButton.textContent='Включить гироскоп';mode.textContent='3D · обзор пальцем на 360°'}
gyroButton.addEventListener('click',async()=>{if(sensor){const q=viewQ;yaw=yawOf(q);const forwardY=2*(q[1]*q[2]-q[3]*q[0]);pitch=Math.asin(Math.max(-1,Math.min(1,-forwardY)));stopSensor();return}if(!window.DeviceOrientationEvent){status.textContent='Датчики ориентации здесь недоступны. Осматривайтесь пальцем.';return}try{if(typeof DeviceOrientationEvent.requestPermission==='function'){const permission=await DeviceOrientationEvent.requestPermission();if(permission!=='granted'){status.textContent='Доступ к датчикам не разрешён. Можно управлять пальцем.';return}}sensor=true;raw=null;alignment=null;gyroButton.textContent='Выключить гироскоп';status.textContent='Ожидаем данные датчиков… Держите телефон перед собой.';timer=setTimeout(()=>{if(!raw&&sensor){stopSensor();status.textContent='Данные датчиков не поступают. Попробуйте открыть страницу по HTTPS во внешнем браузере. Пока доступен обзор пальцем.'}},5000)}catch(e){stopSensor();status.textContent='Доступ к датчикам заблокирован. Откройте страницу по HTTPS в браузере или используйте палец.'}});
document.querySelector('#reset').addEventListener('click',()=>{yaw=0;pitch=0;if(sensor&&raw)alignment=-yawOf(raw);else alignment=null;status.textContent='Направление центрировано на окно.'});
document.querySelector('#full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else status.textContent='Полноэкранный режим недоступен в этом браузере.'}catch(e){status.textContent='Полноэкранный режим недоступен в этом просмотрщике.'}});
canvas.addEventListener('pointerdown',e=>{if(activePointer!==null)return;activePointer=e.pointerId;canvas.setPointerCapture(e.pointerId);if(sensor){yaw=yawOf(viewQ);const q=viewQ;pitch=Math.asin(Math.max(-1,Math.min(1,2*(q[3]*q[0]-q[1]*q[2]))));stopSensor()}drag={x:e.clientX,y:e.clientY,yaw,pitch}});
let drag=null;canvas.addEventListener('pointermove',e=>{if(e.pointerId!==activePointer||!drag)return;yaw=drag.yaw-(e.clientX-drag.x)*.005;pitch=Math.max(-1.48,Math.min(1.48,drag.pitch-(e.clientY-drag.y)*.005))});function end(e){if(e.pointerId===activePointer){activePointer=null;drag=null}}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',end);
function multiply(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o}
function view(q){let [x,y,z,w]=q;x=-x;y=-y;z=-z;const m=new Float32Array([1-2*(y*y+z*z),2*(x*y+z*w),2*(x*z-y*w),0,2*(x*y-z*w),1-2*(x*x+z*z),2*(y*z+x*w),0,2*(x*z+y*w),2*(y*z-x*w),1-2*(x*x+y*y),0,0,0,0,1]);const eye=[.4,1.62,.7];for(let r=0;r<3;r++)m[12+r]=-(m[r]*eye[0]+m[4+r]*eye[1]+m[8+r]*eye[2]);return m}
let projection;function resize(){const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);gl.viewport(0,0,canvas.width,canvas.height);const f=1/Math.tan(72*Math.PI/360),near=.05,far=50;projection=new Float32Array([f/(w/h),0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0])}addEventListener('resize',resize);resize();
function frame(){viewQ=sensor&&raw?qm(qa(0,1,0,alignment??0),raw):manualQ();gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniformMatrix4fv(matrixUniform,false,multiply(projection,view(viewQ)));gl.drawArrays(gl.TRIANGLES,0,count);requestAnimationFrame(frame)}frame();
</script></body></html>
