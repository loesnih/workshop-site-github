<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1418"><title>КЕДР-7 · Терминал станции</title>
<style>
:root{color-scheme:dark;--bg:#091217;--panel:#101e23;--line:#2a4145;--text:#d8e5df;--muted:#8fa9a5;--green:#a8e6c7;--amber:#efbf79;--red:#f09b8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}body:after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0px,transparent 3px,#0000000b 4px);z-index:5}button,input{font:inherit}button{color:var(--text);cursor:pointer;border:1px solid var(--line);background:#17282d;padding:12px 16px;min-height:46px;border-radius:5px}button:hover{background:#213a3d}button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:3px}button:disabled{opacity:.5;cursor:default}.primary{color:#10221b;background:var(--green);border-color:var(--green)}.primary:hover{background:#c0f3db}main{max-width:1280px;margin:auto;padding:32px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;padding-bottom:24px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;color:var(--amber);letter-spacing:.17em}h1{font-size:30px;line-height:1.2;letter-spacing:.04em;margin:10px 0}.online{color:var(--green);font-size:12px}.online:before{content:'';display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:10px}.meta{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:590px}aside{padding:24px 24px 24px 0;border-right:1px solid var(--line)}nav{display:grid;gap:8px}.nav{text-align:left;background:transparent;border-color:transparent;display:flex;justify-content:space-between;gap:8px}.nav[aria-current=page]{background:#1d3335;border-color:#3b5b58;color:var(--green)}.nav span{color:var(--muted);font-size:12px}.side-label{font-size:11px;letter-spacing:.1em;color:var(--muted);margin:0 0 12px}.objective{border-top:1px solid var(--line);margin-top:28px;padding-top:20px;font-size:12px;color:var(--muted)}.objective strong{display:block;color:var(--amber);font-size:13px;margin-bottom:8px}.stage{min-width:0;padding:28px 0 32px 36px}h2{font-size:26px;line-height:1.3;margin:0 0 14px;font-weight:500;color:var(--green)}p{margin:0 0 18px}.lead{max-width:680px;color:var(--muted)}.tag{font-size:11px;letter-spacing:.1em;color:var(--amber);margin-bottom:16px}.stat-row{display:flex;gap:38px;flex-wrap:wrap;margin:32px 0}.stat small{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.stat strong{font-size:22px;font-weight:400}.rule{border-top:1px solid var(--line);padding-top:22px;margin-top:26px}.actions{display:flex;gap:10px;flex-wrap:wrap}.files{display:grid;gap:10px}.file{display:block;text-align:left;width:100%;padding:17px 18px;background:var(--panel)}.file strong{display:block;font-size:15px;font-weight:500}.file small{display:block;color:var(--muted);font-size:12px;margin-top:5px}.file .lock{color:var(--amber)}.document{max-width:730px;line-height:1.85}.document p{margin-bottom:20px}.document blockquote{margin:24px 0;padding:16px 20px;background:var(--panel);border-left:2px solid var(--amber);color:var(--amber)}.back{margin-bottom:24px;color:var(--muted);background:transparent}.access{max-width:500px;padding:24px;border:1px solid var(--line);background:var(--panel);margin-top:24px}.access label{display:block;color:var(--muted);font-size:12px;margin-bottom:9px}.password-row{display:flex;gap:8px}input{background:#091317;border:1px solid #47605f;color:var(--green);padding:12px;min-width:0;border-radius:4px}#password{width:100%;font-size:23px;letter-spacing:.22em}.hint{font-size:12px;color:var(--muted);margin-top:14px}.error{color:var(--red);min-height:26px;font-size:13px;margin:12px 0 0}.map{position:relative;aspect-ratio:1.9;background-color:#0d1c21;background-image:linear-gradient(#243c3e88 1px,transparent 1px),linear-gradient(90deg,#243c3e88 1px,transparent 1px);background-size:36px 36px;border:1px solid var(--line);margin:22px 0;min-height:220px;overflow:hidden}.map:before{content:'';position:absolute;width:55%;height:25%;left:20%;top:35%;border-left:2px dashed var(--green);border-bottom:2px dashed var(--green);transform:skewY(-12deg)}.point{position:absolute;font-size:11px;background:#10241f;padding:5px 8px;color:var(--green);border:1px solid #477b64}.station{left:9%;top:24%}.beacon{right:8%;bottom:22%;color:var(--amber);border-color:#836b45}.coordinates{color:var(--amber);font-size:clamp(18px,3vw,26px);overflow-wrap:anywhere}.events{list-style:none;margin:0;padding:0}.events li{padding:12px 0;border-bottom:1px solid #263a3d;font-size:13px}.events time{color:var(--muted);margin-right:16px}.console{border-top:1px solid var(--line);padding:20px 0}.console label{color:var(--muted);font-size:11px;display:block;margin-bottom:8px}.command-row{display:flex;gap:10px;align-items:center}.command-row span{color:var(--green)}#command{flex:1;width:100%}#notice{min-height:26px;color:var(--amber);font-size:12px;margin-top:8px}footer{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:11px;padding:18px 0;border-top:1px solid var(--line)}footer button{padding:0;background:none;border:0;font-size:11px;min-height:32px;color:var(--muted)}.help{display:grid;grid-template-columns:150px 1fr;gap:15px 24px}.help code{color:var(--amber)}@media(max-width:760px){main{padding:22px 16px}header{align-items:flex-start;gap:8px}h1{font-size:24px}.header-right{text-align:right}.layout{display:block;min-height:0}aside{border-right:0;border-bottom:1px solid var(--line);padding:16px 0}nav{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.nav{padding:10px 5px;min-width:0;font-size:12px;justify-content:center}.nav span,.side-label,.objective{display:none}.stage{padding:24px 0;min-height:400px}h2{font-size:23px}.stat-row{gap:24px}.access{padding:17px}.password-row{flex-wrap:wrap}.password-row button{width:100%}.command-row button{padding:10px}.help{grid-template-columns:110px 1fr;font-size:13px}footer{flex-wrap:wrap}.map{min-height:200px}.meta{font-size:10px}.eyebrow{font-size:10px}.document{font-size:14px}}
</style><script src="../../assets/demo-nav.js" defer></script>
</head>
<body><main><header><div><div class="eyebrow">ОРБИТАЛЬНОЕ УПРАВЛЕНИЕ / СЕКТОР 27</div><h1>КЕДР-7</h1><div class="meta">Исследовательская станция. Локальный терминал</div></div><div class="header-right"><div class="online">СИСТЕМА ДОСТУПНА</div><div class="meta" id="clock">--:--:--</div></div></header>
<div class="layout"><aside><div class="side-label">НАВИГАЦИЯ</div><nav aria-label="Разделы терминала"><button class="nav" data-page="home" aria-current="page">Обзор <span>01</span></button><button class="nav" data-page="files">Архив <span>02</span></button><button class="nav" data-page="map">Маршрут <span id="mapState">ЗАКРЫТ</span></button><button class="nav" data-page="events">Журнал <span>04</span></button></nav><div class="objective"><strong>Текущая задача</strong><div id="objective">Найдите код доступа в архиве. Откройте координаты аварийного маяка.</div></div></aside><section class="stage" id="stage" aria-label="Содержимое терминала"></section></div>
<section class="console"><form id="commandForm"><label for="command">КОМАНДНАЯ СТРОКА · НЕОБЯЗАТЕЛЬНО, ВСЁ ДОСТУПНО КНОПКАМИ</label><div class="command-row"><span aria-hidden="true">&gt;</span><input id="command" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="help" maxlength="100" aria-label="Команда терминала"><button type="submit">Ввод ↵</button></div></form><div id="notice" role="status" aria-live="polite"></div></section>
<footer><span>КЕДР-7 / автономный режим <span id="storageInfo"></span></span><button id="reset">Сбросить прохождение</button></footer></main>
<script>
'use strict';
// Настройки сюжета. Здесь можно менять станцию, пароль и координаты.
const CONFIG={password:'0427',coordinates:'N 18.427 / E 73.091',beacon:'Маяк «Север»'};
const KEY='kedr7-terminal-v1',stage=document.querySelector('#stage'),notice=document.querySelector('#notice');
let state={unlocked:false,read:[],events:[]},page='home',activeFile=null;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object'){state.unlocked=saved.unlocked===true;state.read=Array.isArray(saved.read)?saved.read.filter(x=>['arrival','shift','signal'].includes(x)):[];state.events=Array.isArray(saved.events)?saved.events.filter(x=>x&&typeof x.at==='string'&&typeof x.text==='string').slice(-40):[]}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.querySelector('#storageInfo').textContent=' / прогресс сохраняется'}catch(e){document.querySelector('#storageInfo').textContent=' / без сохранения'}}
function log(text){state.events.push({at:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),text});state.events=state.events.slice(-40);save()}
function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const files={arrival:{title:'01 / Прибытие',summary:'Записка руководителя экспедиции',body:'<p>Если вы читаете это сообщение, станция уже перешла в автономный режим. Экипаж отправился к аварийному маяку. Канал дальней связи отключён.</p><p>Координаты находятся в закрытом файле «Последний сигнал». Код сохранил дежурный инженер. Проверьте его запись о смене.</p><blockquote>Найдите код в архиве и восстановите маршрут до маяка.</blockquote>'},shift:{title:'02 / Запись инженера',summary:'Смена 04. Обслуживание оборудования',body:'<p>Смена 04. Проверка резервного питания завершена. Линия связи с сектором 27 работает нестабильно.</p><p>После очередного сброса я заменил код доступа. Чтобы никто не забыл: сначала номер смены, затем номер сектора. Оба номера записываем двумя цифрами.</p><blockquote>СМЕНА: 04<br>СЕКТОР: 27<br>Формат кода: ССNN, четыре цифры подряд.</blockquote><p>Запись оставлена в локальном архиве до возвращения экипажа.</p>'},signal:{title:'03 / Последний сигнал',summary:'Закрытый файл. Координаты эвакуации',body:()=>'<p>Экспедиция достигла аварийного маяка. Условия стабильны. Ожидаем остальных участников группы.</p><blockquote>'+escape(CONFIG.beacon)+'<br><span class="coordinates">'+escape(CONFIG.coordinates)+'</span></blockquote><p>Двигайтесь по старому сервисному проходу до ретранслятора. Далее следуйте указателям на северную площадку. Маршрут доступен в меню терминала.</p><div class="actions"><button class="primary" data-page="map">Открыть маршрут</button></div>'}};
function sync(){document.querySelectorAll('.nav').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.querySelector('#mapState').textContent=state.unlocked?'ОТКРЫТ':'ЗАКРЫТ';document.querySelector('#objective').textContent=state.unlocked?'Координаты получены. Откройте маршрут до аварийного маяка.':'Найдите код доступа в архиве. Откройте координаты аварийного маяка.'}
function show(next){page=next;activeFile=null;notice.textContent='';sync();render()}
function render(){if(page==='home'){stage.innerHTML='<div class="tag">СЕАНС ГОСТЯ / ЛОКАЛЬНЫЙ ДОСТУП</div><h2>Добро пожаловать на станцию</h2><p class="lead">Экипаж покинул комплекс. Терминал хранит последние записи и маршрут к месту эвакуации.</p><div class="stat-row"><div class="stat"><small>ПИТАНИЕ</small><strong>Резервное</strong></div><div class="stat"><small>СВЯЗЬ</small><strong>Нет сигнала</strong></div><div class="stat"><small>АРХИВ</small><strong>3 файла</strong></div></div><div class="rule"><p>'+(state.unlocked?'Доступ восстановлен. Координаты аварийного маяка доступны.':'Для получения координат откройте архив и найдите код доступа.')+'</p><div class="actions"><button class="primary" data-page="files">Открыть архив</button><button data-page="help">Справка</button>'+(state.unlocked?'<button data-page="map">Маршрут к маяку</button>':'')+'</div></div>'}
else if(page==='files'){stage.innerHTML='<div class="tag">ХРАНИЛИЩЕ / 3 ЗАПИСИ</div><h2>Локальный архив</h2><p class="lead">В сообщениях экипажа сохранились подсказки. Выберите файл.</p><div class="files">'+Object.entries(files).map(([id,f])=>'<button class="file" data-file="'+id+'"><strong>'+f.title+'</strong><small>'+f.summary+'</small><small class="'+(id==='signal'&&!state.unlocked?'lock':'')+'">'+(id==='signal'&&!state.unlocked?'ТРЕБУЕТСЯ КОД':state.read.includes(id)?'ПРОЧИТАНО':'ДОСТУПНО')+'</small></button>').join('')+'</div>'}
else if(page==='map'){stage.innerHTML=state.unlocked?'<div class="tag">МАРШРУТ ВОССТАНОВЛЕН</div><h2>'+escape(CONFIG.beacon)+'</h2><div class="coordinates">'+escape(CONFIG.coordinates)+'</div><div class="map" role="img" aria-label="Условная схема пути от станции Кедр-7 к маяку Север"><span class="point station">КЕДР-7</span><span class="point beacon">МАЯК СЕВЕР</span></div><p class="lead">Сервисный проход. Ретранслятор. Северная площадка.</p><p>Задача выполнена: вы нашли координаты эвакуации.</p>':'<div class="tag">НЕДОСТАТОЧНО ДАННЫХ</div><h2>Маршрут недоступен</h2><p class="lead">Координаты находятся в файле «Последний сигнал». Найдите код в архиве станции.</p><button class="primary" data-file="signal">Открыть закрытый файл</button>'}
else if(page==='events'){stage.innerHTML='<div class="tag">ИСТОРИЯ СЕАНСА</div><h2>Журнал событий</h2><ul class="events">'+state.events.slice().reverse().map(e=>'<li><time>'+escape(e.at)+'</time>'+escape(e.text)+'</li>').join('')+'</ul>'}
else if(page==='help'){stage.innerHTML='<div class="tag">СПРАВОЧНАЯ СЛУЖБА</div><h2>Работа с терминалом</h2><p class="lead">Все действия доступны кнопками. Команды ниже дают тот же результат.</p><div class="help"><code>help</code><span>Открыть справку</span><code>status</code><span>Обзор станции</span><code>files</code><span>Список файлов</span><code>open 1 / 2 / 3</code><span>Открыть файл по номеру</span><code>unlock КОД</code><span>Ввести найденный код</span><code>map</code><span>Маршрут эвакуации</span><code>log</code><span>Журнал событий</span></div>'}}
function openFile(id){if(!files[id])return;page='files';activeFile=id;sync();notice.textContent='';const f=files[id];if(id==='signal'&&!state.unlocked){stage.innerHTML='<button class="back" data-page="files">← К архиву</button><div class="tag">ОГРАНИЧЕННЫЙ ДОСТУП</div><h2>Последний сигнал</h2><p class="lead">Для чтения файла нужен четырёхзначный код. Подсказка находится в записи инженера.</p><form class="access" id="unlockForm"><label for="password">КОД ДОСТУПА</label><div class="password-row"><input id="password" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="••••" aria-describedby="accessError"><button type="submit" class="primary">Открыть</button></div><div class="error" id="accessError" role="status"></div><button type="button" data-file="shift">Прочитать запись инженера</button></form>';return}if(!state.read.includes(id)){state.read.push(id);log('Прочитан файл: '+f.title)}stage.innerHTML='<button class="back" data-page="files">← К архиву</button><div class="tag">АРХИВ / ЧТЕНИЕ</div><h2>'+f.title+'</h2><article class="document">'+(typeof f.body==='function'?f.body():f.body)+'</article>'}
function unlock(code){if(state.unlocked){notice.textContent='Доступ уже открыт.';openFile('signal');return true}if(code!==CONFIG.password){log('Неверный код доступа');const error=document.querySelector('#accessError');if(error)error.textContent='Неверный код. Сначала номер смены, затем сектора.';notice.textContent='Доступ закрыт. Проверьте запись инженера.';return false}state.unlocked=true;log('Доступ восстановлен. Координаты маяка получены');openFile('signal');notice.textContent='Код принят. Маршрут доступен.';return true}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)show(b.dataset.page);if(b.dataset.file)openFile(b.dataset.file)});
document.addEventListener('submit',e=>{if(e.target.id==='unlockForm'){e.preventDefault();unlock(document.querySelector('#password').value.trim())}});
document.querySelector('#commandForm').addEventListener('submit',e=>{e.preventDefault();const input=document.querySelector('#command'),raw=input.value.trim(),parts=raw.split(/\s+/),cmd=parts[0].toLowerCase();input.value='';if(!raw)return;const routes={help:'help','помощь':'help',status:'home','статус':'home',files:'files','архив':'files',map:'map','карта':'map',log:'events','журнал':'events'};if(routes[cmd])show(routes[cmd]);else if(cmd==='open'||cmd==='открыть'){const id={'1':'arrival','2':'shift','3':'signal',arrival:'arrival',shift:'shift',signal:'signal'}[parts[1]];if(id)openFile(id);else notice.textContent='Укажите номер: open 1, open 2 или open 3.'}else if(cmd==='unlock'||cmd==='код')unlock(parts[1]||'');else notice.textContent='Неизвестная команда. Введите help или используйте кнопки.'});
document.querySelector('#reset').addEventListener('click',()=>{state={unlocked:false,read:[],events:[]};log('Начат новый сеанс');show('home');notice.textContent='Прохождение сброшено.'});
function clock(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString('ru-RU')}clock();setInterval(clock,1000);if(!state.events.length)log('Терминал активирован. Локальный сеанс открыт');save();sync();render();
</script></body></html>
