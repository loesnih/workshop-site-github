for(let i=0;i<3;i++)box(monitor,-.3+i*.3,-.23,.12,.16,.025,.01,teal);
for(let i=0;i<5;i++)for(let j=0;j<2;j++)box(terminal,-.38+i*.19,1.31,.12+j*.17,.14,.025,.1,dark);
marker(terminal,'Терминал',0,2.48,0,1.7);interactive(terminal,'terminal','lab',[0,1.7,-.05]);
function techCabinet(x,z,rotation){
 const g=group(lab,x,0,z);g.rotation.y=rotation;contact(g,0,0,1.7,1.25);
 box(g,0,.13,0,1.25,.26,.75,dark);box(g,0,1.2,0,1.25,2.1,.75,panel);
 for(const y of [.56,1.23,1.9]){box(g,0,y,.4,1.12,.58,.075,white);box(g,-.34,y,.45,.26,.055,.025,dark);box(g,.42,y,.45,.07,.07,.025,teal);}
 box(g,0,2.3,0,1.32,.1,.82,dark);
}
techCabinet(3.2,-2.5,-Math.PI/2);techCabinet(3.2,2,-Math.PI/2);
plaque(lab,['ПИТАНИЕ КАПСУЛЫ','НЕ ОТКЛЮЧАТЬ'],.5,2.75,-3.84,2.3,0,'#493d30','#ffd49b');
// Планета видна через реальное окно; весь ландшафт — геометрия.
const outside=group(scene);const skyMat=new T.MeshBasicMaterial({color:'#7bafb2'});
box(outside,0,5,-34,70,30,.2,skyMat);
const terrain=material('terrain','#b38977',0,1),rockMat=material('rock','#826f79',0,1);
box(outside,0,-.55,-18,60,.4,27,terrain);
for(let i=0;i<17;i++){
 const x=(i-8)*2.6,z=-13-((i*7)%13),h=2+((i*11)%7)*.7;
 const rock=mesh(outside,'cone',x,h/2-.35,z,2.2+(i%3),h,2.3,rockMat);rock.rotation.y=i*1.9;
}
const planet=mesh(outside,'sphere',7,10,-31,3.5,3.5,3.5,new T.MeshBasicMaterial({color:'#edd8b6'}));planet.castShadow=false;
const ring=new T.Mesh(new T.RingGeometry(4.2,4.6,48),new T.MeshBasicMaterial({color:'#d3cec1',side:T.DoubleSide}));ring.position.copy(planet.position);ring.rotation.set(.5,.25,.3);outside.add(ring);
for(let i=0;i<9;i++){const crystal=mesh(outside,'crystal',-5+i*1.35,.2,-7-(i%3)*1.2,.15,.7+(i%3)*.3,.15,teal);crystal.rotation.z=.2;}
scene.add(new T.HemisphereLight('#e7fffa','#50626f',1.65));scene.add(new T.AmbientLight('#ffffff',.25));
const sun=new T.DirectionalLight('#fff0d9',2.5);sun.position.set(1,8,3);sun.target.position.set(4,0,-1);scene.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-11,right:11,top:7,bottom:-7,near:.5,far:24});sun.shadow.normalBias=.035;sun.shadow.bias=-.0003;
for(const x of [0,8]){const fill=new T.PointLight('#b2f1e7',17,8,2);fill.position.set(x,3.15,-.5);scene.add(fill);}
renderer.shadowMap.needsUpdate=true;
const state={room:'living',lamp:true,sampleOrange:false};
let yaw=0,pitch=0,dirty=true,lastRender=0,toastTimer,hintTimer;
const poses={living:{position:[0,1.65,1.8],look:[0,1.25,-2.8]},lab:{position:[8,1.65,2],look:[8.3,1.45,-1.7]}};
const ray=new T.Raycaster(),point=new T.Vector2(),targetRay=new T.Raycaster();
const anchor=new T.Vector3(),direction=new T.Vector3();
function actionOf(object){for(let o=object;o;o=o.parent)if(o.userData.action)return o.userData.action;return null;}
function intersections(caster,includeLabels=true){return caster.intersectObjects(scene.children,true).filter(hit=>!hit.object.userData.ignorePick&&(includeLabels||!hit.object.isSprite));}
function pick(x,y){
 scene.updateMatrixWorld(true);camera.updateMatrixWorld(true);
 const rect=canvas.getBoundingClientRect();point.set((x-rect.left)/rect.width*2-1,-(y-rect.top)/rect.height*2+1);ray.setFromCamera(point,camera);
 const hit=intersections(ray)[0];if(!hit)return null;
 const id=actionOf(hit.object),action=actions.get(id);if(!action||(action.room!=='both'&&action.room!==state.room))return null;
 // Метка не позволяет действовать на предмет, закрытый другой геометрией.
 if(hit.object.isSprite){
  anchor.copy(action.anchor);action.root.localToWorld(anchor);direction.subVectors(anchor,camera.position).normalize();targetRay.set(camera.position,direction);
  const physical=intersections(targetRay,false)[0];if(!physical||actionOf(physical.object)!==id)return null;
 }
 return id;
}
function orient(){camera.rotation.set(pitch,yaw,0,'YXZ');dirty=true;}
function enterRoom(room){
 if(!poses[room])return;state.room=room;const pose=poses[room];camera.position.fromArray(pose.position);camera.lookAt(...pose.look);yaw=camera.rotation.y;pitch=camera.rotation.x;orient();
 $('roomName').textContent=room==='living'?'Жилой отсек':'Лаборатория';
 document.querySelectorAll('[data-room]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.room===room)));
 canvas.style.cursor='grab';resetGesture();dirty=true;
}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2400);}
const dialog=$('dialog');
function showDialog(title,text=null){
 resetGesture();$('hint').hidden=true;$('toast').hidden=true;$('dialogTitle').textContent=title;
 $('roomChoices').hidden=text!==null;$('messageText').hidden=text===null;
 if(text!==null)$('messageText').textContent=text;
 if(!dialog.open)dialog.showModal();
}
$('roomsButton').onclick=()=>{if(ready)showDialog('Комнаты');};
$('help').onclick=()=>{if(ready)showDialog('Как исследовать станцию','Проведите пальцем для осмотра.\nКоснитесь выделенного предмета для взаимодействия.\n\nНа компьютере перетаскивайте сцену мышью. Дверь и меню «Комнаты» позволяют переходить между отсеками.');};
$('closeDialog').onclick=()=>dialog.close();
dialog.addEventListener('close',()=>{resetGesture();dirty=true;});
dialog.addEventListener('pointerdown',e=>e.stopPropagation());dialog.addEventListener('pointerup',e=>e.stopPropagation());
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{enterRoom(b.dataset.room);dialog.close();});
function activate(id){
 if(id==='door'){enterRoom(state.room==='living'?'lab':'living');toast('Переход выполнен');}
 if(id==='wardrobe')showDialog('Шкаф','Скафандр находится на техническом обслуживании');
 if(id==='terminal')showDialog('Запись 014','Образец реагирует на изменение освещения.\nНе отключайте питание капсулы');
 if(id==='lamp'){
  state.lamp=!state.lamp;lampLight.intensity=state.lamp?2.4:0;
  bulb.material=state.lamp?warm:panel;shade.material=state.lamp?orange:dark;
  toast(state.lamp?'Настольная лампа включена':'Настольная лампа выключена');renderer.shadowMap.needsUpdate=true;
 }
 if(id==='capsule'){
  state.sampleOrange=!state.sampleOrange;const color=state.sampleOrange?'#f59d51':'#42dec5';
  sampleMat.color.set(color);sampleMat.emissive.set(color);signalMat.color.set(color);signalMat.emissive.set(color);sampleLight.color.set(color);
  toast(state.sampleOrange?'Образец: оранжевый':'Образец: бирюзовый');
 }
 dirty=true;
}
// Pointer Events объединяют мышь, перо и касания; путь жеста учитывается целиком.
let gesture=null;const held=new Set();
function resetGesture(){
 if(gesture&&canvas.hasPointerCapture(gesture.id))canvas.releasePointerCapture(gesture.id);
 gesture=null;held.clear();
}
canvas.addEventListener('pointerdown',e=>{
 if(!ready||dialog.open||e.button!==0)return;held.add(e.pointerId);
 if(held.size>1){if(gesture)gesture.cancelled=true;return;}
 gesture={id:e.pointerId,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,time:performance.now(),drag:false,cancelled:false};
 canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing';
});
canvas.addEventListener('pointermove',e=>{
 if(!ready||dialog.open)return;
 if(!gesture){if(e.pointerType==='mouse')canvas.style.cursor=pick(e.clientX,e.clientY)?'pointer':'grab';return;}
 if(e.pointerId!==gesture.id||gesture.cancelled)return;
 const g=gesture,dx=e.clientX-g.x,dy=e.clientY-g.y;g.x=e.clientX;g.y=e.clientY;
 if(Math.hypot(e.clientX-g.startX,e.clientY-g.startY)>8)g.drag=true;
 if(g.drag){const sensitivity=Math.PI/Math.max(300,Math.min(canvas.clientWidth,canvas.clientHeight));yaw=(yaw-dx*sensitivity)%(2*Math.PI);pitch=T.MathUtils.clamp(pitch-dy*sensitivity,-1.25,1.25);orient();}
});
canvas.addEventListener('pointerup',e=>{
 held.delete(e.pointerId);if(!gesture||e.pointerId!==gesture.id)return;
 const g=gesture;gesture=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);canvas.style.cursor='grab';
 const distance=Math.hypot(e.clientX-g.startX,e.clientY-g.startY);
 if(ready&&!dialog.open&&!g.cancelled&&!g.drag&&distance<=8&&performance.now()-g.time<550){const id=pick(e.clientX,e.clientY);if(id)activate(id);}
});
canvas.addEventListener('pointercancel',resetGesture);canvas.addEventListener('lostpointercapture',()=>{gesture=null;});canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',resetGesture);
function resize(){
 const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.fov=w<h?76:64;camera.updateProjectionMatrix();dirty=true;resetGesture();
}
window.addEventListener('resize',resize);window.visualViewport?.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{resetGesture();dirty=true;lastRender=0;});
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(now){
 if(failed)return;frame=requestAnimationFrame(render);if(document.hidden)return;
 const animate=state.room==='lab'&&!dialog.open&&!reduced;
 if(now-lastRender<1000/30)return;
 if(animate){sample.rotation.y=now*.00025;dirty=true;}
 if(dirty){try{renderer.render(scene,camera);}catch(error){console.error(error);fail('Ошибка отображения WebGL. Повторите загрузку в браузере с аппаратным ускорением.');return;}dirty=false;lastRender=now;}
}
resize();enterRoom('living');renderer.render(scene,camera);ready=true;$('loading').hidden=true;
hintTimer=setTimeout(()=>$('hint').hidden=true,9000);frame=requestAnimationFrame(render);
}
})();
</script>
