  table(home,2.6,-2.25,2,1.12);

  for(const x of [1.98,2.82])box(home,.09,.11,.6,x,.8,-.95,metal);solid(home,2.4,-.95,.95,.8);
  box(home,1.2,2.3,.72,-3.12,1.15,2.25,metal,'locker');box(home,1.08,2.1,.05,-3.12,1.15,2.64,white,'locker');
  box(home,.025,1.95,.025,-3.12,1.15,2.68,metal,'locker');box(home,.06,.36,.08,-2.91,1.18,2.72,orange,'locker');solid(home,-3.12,2.25,1.2,.85);
  home.actions.locker=()=>{state.locker=true;save();dialog('Шкаф экипажа','Скафандр на обслуживании\n\nАвтоматическая диагностика гермошвов продолжается.');};

  const lab=shell(1);rooms.push(lab);
  table(lab,0,-2.2,4.7,1.3);
  box(lab,.64,.07,.43,-1.4,.94,-2.13,metal,'terminal');box(lab,.09,.3,.09,-1.4,1.1,-2.33,metal,'terminal');
  box(lab,1.1,.72,.13,-1.4,1.5,-2.33,metal,'terminal');glow(box(lab,.95,.57,.02,-1.4,1.5,-2.25,0x285d62,'terminal'),0x285d62);

  lab.actions.terminal=()=>{state.read=true;save();dialog('Образец А–17 / запись 04','Место обнаружения: восточная гряда.\n\nКристаллическая структура реагирует на спектр света. Бирюзовое свечение — устойчивое состояние; оранжевое — ответ на возбуждение. Температура остаётся постоянной.\n\nКоснитесь капсулы, чтобы переключить режим наблюдения. Сигнальная лампа повторяет цвет образца.\n\nЭкипаж отправился к следующей точке отбора. Станция работает автономно.');};

  glass.position.set(1.1,1.62,-2.18);glass.userData.id='capsule';glass.userData.transparent=true;lab.scene.add(glass);lab.pick.push(glass);

  function free(x,z,r=rooms[current]){return Math.abs(x)<3.65&&Math.abs(z)<3.65&&!r.obstacles.some(b=>x>=b.minX&&x<=b.maxX&&z>=b.minZ&&z<=b.maxZ);}

  function move(n){if(motion||busy)return;const [x,z]=nodes[current][n],end=new THREE.Vector3(x,1.58,z);if(!clearPath(camera.position,end)){toast('Путь закрыт мебелью. Выберите другую точку.');return;}motion={start:camera.position.clone(),end,time:performance.now(),duration:Math.max(500,camera.position.distanceTo(end)*380),node:n};drag=null;}

  function updateTags(){camera.updateMatrixWorld();const w=innerWidth,h=innerHeight;for(const t of rooms[current].tags){v.copy(t.pos).project(camera);const x=(v.x*.5+.5)*w,y=(-v.y*.5+.5)*h;const show=v.z>-1&&v.z<1&&x>30&&x<w-30&&y>95&&y<h-75&&visible(t);t.el.hidden=!show;if(show)t.el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`;}}
  function tap(x,y){pointer.set(x/innerWidth*2-1,-y/innerHeight*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(rooms[current].pick,false);const hit=hits.find(h=>!h.object.userData.transparent||h.object.userData.id==='capsule');if(hit){const action=rooms[current].actions[hit.object.userData.id];if(action)action();}}
  const canvas=renderer.domElement;
  canvas.addEventListener('pointerdown',e=>{if(e.button!==0||busy||motion||!$('modal').hidden||drag)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false,time:performance.now()};canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.lastX,dy=e.clientY-drag.lastY;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)drag.moved=true;if(drag.moved){yaw-=dx*.0045;pitch=Math.max(-1.05,Math.min(1.05,pitch-dy*.0045));}drag.lastX=e.clientX;drag.lastY=e.clientY;});
  canvas.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);if(!d.moved&&performance.now()-d.time<550&&!busy&&!motion&&$('modal').hidden)tap(e.clientX,e.clientY);});
  for(const event of ['pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>drag=null);
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3000);}
  function closeDialog(){$('modal').hidden=true;returnFocus?.focus();}
  function dialog(title,text,buttons){drag=null;returnFocus=document.activeElement;$('modalTitle').textContent=title;$('modalText').textContent=text;$('actions').replaceChildren();
    const list=buttons||[{text:'Понятно',fn:closeDialog,primary:true}];for(const item of list){const b=document.createElement('button');b.textContent=item.text;b.className=item.primary?'primary':item.danger?'danger subtle':'subtle';b.onclick=item.fn;$('actions').appendChild(b);}$('modal').hidden=false;$('actions').firstElementChild.focus();}
  function help(){dialog('Здесь всё спокойно','Осмотритесь: проведите пальцем или перетащите мышью.\n\n⌾ — свободная точка обзора. Коснитесь её для плавного перемещения.\n\nПодписи отмечают оборудование и двери. Короткое касание включает действие. Название на двери указывает соседнюю комнату.\n\nЦель — свободно изучить станцию. Прогресс сохраняется автоматически, если браузер разрешает хранение.',[{text:'Начать осмотр',primary:true,fn:()=>{state.intro=true;save();closeDialog();}}]);}
  $('help').onclick=help;
  $('rooms').onclick=()=>dialog('Комнаты','Перейдите в другой отсек или продолжите осмотр.',[
    ...names.map((name,i)=>({text:(current===i?'● ':'○ ')+name,fn:()=>enter(i)})),
    {text:'Закрыть',primary:true,fn:closeDialog},
    {text:'Сбросить прогресс',danger:true,fn:()=>dialog('Сбросить прогресс?','Состояние оборудования и прочитанных записей будет сброшено.',[{text:'Отмена',primary:true,fn:closeDialog},{text:'Сбросить',danger:true,fn:()=>{state=defaults();state.intro=true;sync();save();enter(0);}}])}
  ]);
  $('modal').addEventListener('pointerdown',e=>e.stopPropagation());
  document.addEventListener('keydown',e=>{if($('modal').hidden)return;if(e.key==='Escape'){closeDialog();}if(e.key==='Tab'){const a=[...$('actions').querySelectorAll('button')],first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<1?78:65;camera.updateProjectionMatrix();lastTag=0;}
  addEventListener('resize',resize);resize();sync();setRoom(state.room,state.node);$('boot').hidden=true;
  if(!state.intro)help();
  // Проверка свободных стартов и связности точек при инициализации.
  for(let i=0;i<rooms.length;i++){for(const [x,z] of nodes[i]){if(!free(x,z,rooms[i]))throw Error('Точка обзора занята');}const seen=new Set([0]);for(let pass=0;pass<4;pass++)for(const a of [...seen])for(let b=0;b<4;b++){const p=nodes[i][a],q=nodes[i][b];if(clearPath(new THREE.Vector3(p[0],1.58,p[1]),new THREE.Vector3(q[0],1.58,q[1]),rooms[i]))seen.add(b);}if(seen.size!==4)throw Error('Недоступная точка обзора');}
  renderer.setAnimationLoop(time=>{
    if(motion){const t=Math.min(1,(time-motion.time)/motion.duration),e=t*t*(3-2*t);camera.position.lerpVectors(motion.start,motion.end,e);if(t===1){state.node=motion.node;motion=null;save();}}
    camera.rotation.set(pitch,yaw,0);sample.rotation.y=time*.0003;
    if(time-lastTag>80){updateTags();lastTag=time;}
    renderer.render(rooms[current].scene,camera);
  });
}
</script>
</body>
